services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/hackathon
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p hackathon 'RETURN 1'"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
